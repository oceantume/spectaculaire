server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # .br/.gz files are pre-generated at build time (scripts/precompress.ts) and served
    # as-is with zero runtime cost; `gzip`/`brotli` on their own are just fallbacks for
    # anything without a precompressed sibling.
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    brotli on;
    brotli_static on;
    brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # Redirect root to current default festival
    location = / {
        return 301 /feq-2026/;
    }

    # Hashed assets — cache forever
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "max-age=0, stale-while-revalidate=2592000";
        try_files $uri $uri/index.html =404;
    }

    access_log /data/logs/access.log analytics;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed assets — cache forever
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker files — always revalidate (browsers require this)
    location ~* ^/(sw|registerSW|workbox-[^/]+)\.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Static files without content hash — cache for a week
    location ~* \.(ico|svg|png|webmanifest|txt)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Redirect root to default event
    location = / {
        return 302 /feq2026;
    }

    # HTML entry points — always revalidate
    # Handles /feq2026, /feq2026/, /feq2026/index.html etc.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
}

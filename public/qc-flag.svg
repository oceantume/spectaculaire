<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 6 4">
  <!-- Blue background -->
  <rect width="6" height="4" fill="#002395"/>
  <!-- White cross -->
  <rect x="2.5" y="0" width="1" height="4" fill="white"/>
  <rect x="0" y="1.5" width="6" height="1" fill="white"/>
  <!-- Fleurs-de-lis (simplified) -->
  <!-- Top-left -->
  <text x="1.25" y="1.35" text-anchor="middle" font-size="1.1" fill="white">⚜</text>
  <!-- Top-right -->
  <text x="4.75" y="1.35" text-anchor="middle" font-size="1.1" fill="white">⚜</text>
  <!-- Bottom-left -->
  <text x="1.25" y="3.35" text-anchor="middle" font-size="1.1" fill="white">⚜</text>
  <!-- Bottom-right -->
  <text x="4.75" y="3.35" text-anchor="middle" font-size="1.1" fill="white">⚜</text>
</svg>

<!doctype html>
<html lang="fr">
  <head>
    <script>
      try {
        if (JSON.parse(localStorage.getItem("theme")) === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    </script>
    <style>
      /* Color must match .dark background-color in src/index.css */
      html.dark { background-color: #111827; }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spectaculaire</title>
    <meta name="description" content="Horaire de la programmation du Festival d'été de Québec 2026" />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/qc.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/192.png" />
    <link rel="preload" href="/qc.svg" as="image" type="image/svg+xml" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

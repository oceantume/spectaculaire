name: Update schedule

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC — adjust as needed
  workflow_dispatch:        # allow manual runs

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and transform schedule
        run: node scripts/update-schedule.ts

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/schedule.json
          git diff --cached --quiet || git commit -m "chore: update schedule.json"
          git push

name: Update data

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC — adjust as needed
  workflow_dispatch: # allow manual runs

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Fetch and transform schedule
        run: node scripts/update.ts

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/festivals/
          git diff --cached --quiet || git commit -m "Automatically update festival data"
          git push
